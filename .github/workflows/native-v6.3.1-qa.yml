name: v6.3.5 scientific terminology and textbook QA
on:
  push:
    branches: [native-v6.3.1-qa-reconciled]
    paths:
      - 'app/**'
      - 'tools/validate_content.py'
      - '.github/workflows/native-v6.3.1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify bilingual data and 58 figure assets
        run: python3 tools/validate_content.py
      - name: Cleanly compile native app and UI instrumentation tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Inspect manifest and APK embedded chapter data
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > v635-badging.txt
          grep -F "name='com.gasczoology.introzoology'" v635-badging.txt
          grep -F "versionCode='635'" v635-badging.txt
          grep -F "versionName='6.3.5-QA'" v635-badging.txt
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              d=json.loads(z.read("assets/content.json"))
              assert d["edition"]=="6.3.5-QA"
              assert d["editorialRevision"]["importedEdition"]=="6.3.0-QA"
              assert len(d["chapters"])==28 and len(d["plates"])==58
              assert len(d["units"])==5 and len(d["questionBank"])==5
              plate_names=[x for x in z.namelist() if x.startswith("assets/plates/") and x.endswith(".png")]
              assert len(plate_names)==58, len(plate_names)
          print("PASS: embedded native lesson content and version parity")
          PY
          sha256sum "$APK" > v635-debug.sha256
      - name: Publish development APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: Introduction-to-Zoology-v6.3.5-Science-Accuracy-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            v635-badging.txt
            v635-debug.sha256
          if-no-files-found: error
          retention-days: 30
