name: v6.3.6 scientific terminology and textbook QA
on:
  push:
    branches: [native-v6.3.1-qa-reconciled]
    paths:
      - 'app/**'
      - 'tools/validate_content.py'
      - '.github/workflows/native-v6.3.1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Render corrected scientific figure masters as PNG
        run: |
          python3 -m pip install 'CairoSVG>=2.7,<3'
          python3 tools/render_corrected_plates.py
      - name: Verify approved launcher image resources
        run: |
          echo "edbf082b7b46bb05bf3bac8840ad397fcc19c799fbd8ff65c9d571ee1a3d3ca6  app/src/main/res/drawable-nodpi/zoology_launcher_legacy.webp" | sha256sum --check
          echo "671620d2367d98971d80cf7a3614d5f5a4172aac9af7692063bef63f7fc2e046  app/src/main/res/drawable-nodpi/zoology_launcher_foreground.webp" | sha256sum --check
          grep -q '@drawable/ic_intro_zoology' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable-anydpi-v26/ic_intro_zoology.xml
      - name: Verify bilingual data and 58 figure assets
        run: python3 tools/validate_content.py
      - name: Cleanly compile native app and UI instrumentation tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Inspect manifest and APK embedded chapter data
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > v636-badging.txt
          grep -F "name='com.gasczoology.introzoology'" v636-badging.txt
          grep -F "versionCode='636'" v636-badging.txt
          grep -F "versionName='6.3.6-QA'" v636-badging.txt
          python3 - <<'PY'
          import zipfile,json
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as z:
              d=json.loads(z.read("assets/content.json"))
              assert d["edition"]=="6.3.6-QA"
              assert d["editorialRevision"]["importedEdition"]=="6.3.0-QA"
              assert len(d["chapters"])==28 and len(d["plates"])==58
              assert len(d["units"])==5 and len(d["questionBank"])==5
              plate_names=[x for x in z.namelist() if x.startswith("assets/plates/") and x.endswith(".png")]
              assert len(plate_names)==58, len(plate_names)
          print("PASS: embedded native lesson content and version parity")
          PY
          sha256sum "$APK" > v636-debug.sha256
      - name: Publish development APK and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: Introduction-to-Zoology-v6.3.6-Science-Accuracy-QA
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            v636-badging.txt
            v636-debug.sha256
          if-no-files-found: error
          retention-days: 30
