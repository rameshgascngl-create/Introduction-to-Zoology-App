name: Introduction to Zoology - Phase II checked-in native build
on:
  push:
    branches: ['phase2-native-source']
    paths:
      - 'app/**'
      - 'tools/validate_content.py'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/phase2-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-native-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout checked-in native Android project
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify bilingual syllabus content and PNG integrity
        run: python3 tools/validate_content.py
      - name: Build Kotlin and Jetpack Compose from checked-in files
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify native debug APK identity and signing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee phase2-package-info.txt
          grep -F "name='com.gasczoology.introzoology'" phase2-package-info.txt
          grep -F "versionName='6.1.1-QA'" phase2-package-info.txt
          sha256sum "$APK" | tee phase2-native-debug.sha256
      - name: Publish installable Phase II debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Introduction-to-Zoology-v6.1.1-QA-CHECKED-IN-NATIVE-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            phase2-native-debug.sha256
            phase2-package-info.txt
          if-no-files-found: error
          retention-days: 30
