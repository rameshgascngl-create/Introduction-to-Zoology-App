name: Phase III — Android emulator UI, rotation, Tamil and screenshots
on:
  push:
    branches: [phase3-science-tamil-qa]
    paths:
      - 'app/**'
      - 'tools/validate_content.py'
      - 'tools/run_phase3_emulator_qa.sh'
      - '.github/workflows/phase3-emulator-qa.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 34 test image and build SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate 28 chapters and 62 bilingual keys
        run: python3 tools/validate_content.py
      - name: Build UI tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run instrumented Compose tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-metrics
          script: bash tools/run_phase3_emulator_qa.sh
      - name: Save instrumented-test evidence even when emulator fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Introduction-Zoology-P3-Emulator-UI-Evidence
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            qa-screenshots/**
            emulator-last-logcat.txt
          if-no-files-found: warn
          retention-days: 30
