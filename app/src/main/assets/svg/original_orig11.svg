<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Four levels of protein structure: primary chain, secondary helix and sheet, tertiary fold, quaternary assembly"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Levels of protein organisation</text><circle cx="90" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><circle cx="104" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><line x1="96" y1="90" x2="98" y2="90" stroke="#1e5c8a" stroke-width="1.4"/><circle cx="118" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><line x1="110" y1="90" x2="112" y2="90" stroke="#1e5c8a" stroke-width="1.4"/><circle cx="132" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><line x1="124" y1="90" x2="126" y2="90" stroke="#1e5c8a" stroke-width="1.4"/><circle cx="146" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><line x1="138" y1="90" x2="140" y2="90" stroke="#1e5c8a" stroke-width="1.4"/><circle cx="160" cy="90" r="6" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.4"/><line x1="152" y1="90" x2="154" y2="90" stroke="#1e5c8a" stroke-width="1.4"/><text x="120" y="115" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e5c8a">Primary</text><text x="120" y="126" text-anchor="middle" font-size="7.5" fill="#5a4e42">amino-acid sequence</text><polyline points="240,70 246,74 250,78 249,82 245,86 238,90 232,94 230,98 232,102 237,106 244,110 249,114 250,118 247,122 241,126" fill="none" stroke="#2e6b4f" stroke-width="3"/><path d="M270,75 L290,80 L270,90 L290,100 L270,110" fill="none" stroke="#2e6b4f" stroke-width="3"/><text x="270" y="128" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2e6b4f">Secondary</text><text x="270" y="139" text-anchor="middle" font-size="7.5" fill="#5a4e42">helix / pleated sheet</text><path d="M340,70 C365,65 380,85 370,100 C390,105 385,125 365,120 C360,135 335,130 335,115 C320,110 325,90 340,70 Z" fill="#f3e7f6" stroke="#7a3b8c" stroke-width="1.8"/><text x="355" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a3b8c">Tertiary</text><text x="355" y="161" text-anchor="middle" font-size="7.5" fill="#5a4e42">3-D folded chain</text><ellipse cx="428" cy="85" rx="20" ry="16" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.8"/><ellipse cx="452" cy="100" rx="20" ry="16" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.8"/><text x="440" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a1e3c">Quaternary</text><text x="440" y="161" text-anchor="middle" font-size="7.5" fill="#5a4e42">multiple subunits</text><line x1="70" y1="180" x2="470" y2="180" stroke="#d8d0c4" stroke-width="1"/><text x="250" y="205" text-anchor="middle" font-size="9.5" fill="#5a4e42">An active site is a functional region, not a fifth structural level</text><text x="250" y="222" text-anchor="middle" font-size="9.5" fill="#8a1e3c">Denaturation disrupts higher-order structure — it does not add a new level</text></svg>