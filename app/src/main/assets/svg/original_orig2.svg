<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Binomial name Panthera leo with genus and species epithet labelled"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Binomial nomenclature rule</text><text x="250" y="90" text-anchor="middle" font-size="28" font-style="italic" font-weight="bold" fill="#153f2e">Panthera <tspan fill="#1e5c8a">leo</tspan></text><rect x="150" y="62" width="118" height="34" rx="6" fill="none" stroke="#2e6b4f" stroke-width="1.4" stroke-dasharray="3,3"/><rect x="272" y="62" width="72" height="34" rx="6" fill="none" stroke="#1e5c8a" stroke-width="1.4" stroke-dasharray="3,3"/><line x1="185" y1="98" x2="150" y2="122" stroke="#2e6b4f" stroke-width="1.2"/><text x="75" y="132" font-size="11" fill="#2e6b4f" font-weight="bold">Genus</text><text x="40" y="146" font-size="9.5" fill="#5a4e42">Capital initial letter</text><line x1="315" y1="98" x2="360" y2="122" stroke="#1e5c8a" stroke-width="1.2"/><text x="350" y="132" font-size="11" fill="#1e5c8a" font-weight="bold">Species epithet</text><text x="350" y="146" font-size="9.5" fill="#5a4e42">Lowercase, second word</text><line x1="120" y1="170" x2="380" y2="170" stroke="#8a1e3c" stroke-width="1.6"/><text x="250" y="166" text-anchor="middle" font-size="9.5" fill="#8a1e3c">Whole name italicised in print / underlined by hand</text><text x="250" y="195" text-anchor="middle" font-size="9.5" fill="#5a4e42">Governed by the ICZN — one accepted name per stated classification</text><text x="250" y="210" text-anchor="middle" font-size="9.5" fill="#5a4e42">Historical synonyms may exist for the same species</text><text x="250" y="235" text-anchor="middle" font-size="9.5" font-style="italic" fill="#5a4e42">Frog example: Hoplobatrachus tigerinus</text><text x="250" y="250" text-anchor="middle" font-size="9" font-style="italic" fill="#5a4e42">(formerly Rana tigrina)</text></svg>