250" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#153f2e">Genotype 1 TT : 2 Tt : 1 tt  —  Phenotype 3 dominant : 1 recessive</text><text x="250" y="262" text-anchor="middle" font-size="9" fill="#8a1e3c">Expected probability, not a compulsory count in every small family</text></svg>