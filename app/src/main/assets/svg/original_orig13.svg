<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Three lipid classes: triacylglycerol, phospholipid and steroid compared structurally"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Major lipid categories and roles</text><line x1="60" y1="90" x2="60" y2="130" stroke="#8f3f0b" stroke-width="3"/><polyline points="70,96 80,84 90,96 100,84 110,96 120,84" fill="none" stroke="#8f3f0b" stroke-width="2"/><polyline points="70,114 80,102 90,114 100,102 110,114 120,102" fill="none" stroke="#8f3f0b" stroke-width="2"/><polyline points="70,132 80,120 90,132 100,120 110,132 120,120" fill="none" stroke="#8f3f0b" stroke-width="2"/><text x="110" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3f0b">Triacylglycerol</text><text x="110" y="172" text-anchor="middle" font-size="8" fill="#5a4e42">glycerol + 3 fatty acids</text><circle cx="255" cy="90" r="12" fill="#dbe9f2" stroke="#1e5c8a" stroke-width="1.6"/><polyline points="249,109 257,99 265,109 273,99 281,109 289,99" fill="none" stroke="#1e5c8a" stroke-width="1.8"/><polyline points="261,109 269,99 277,109 285,99 293,109 301,99" fill="none" stroke="#1e5c8a" stroke-width="1.8"/><text x="270" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1e5c8a">Phospholipid</text><text x="270" y="172" text-anchor="middle" font-size="8" fill="#5a4e42">polar head + fatty-acid tails</text><g fill="none" stroke="#7a3b8c" stroke-width="1.8"><rect x="380" y="72" width="20" height="16" rx="3"/><rect x="398" y="80" width="20" height="16" rx="3"/><rect x="416" y="72" width="20" height="16" rx="3"/><rect x="416" y="92" width="16" height="14" rx="3"/></g><text x="410" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7a3b8c">Steroid</text><text x="410" y="172" text-anchor="middle" font-size="8" fill="#5a4e42">fused-ring structure</text><text x="250" y="205" text-anchor="middle" font-size="9.5" fill="#5a4e42">Chemically distinct classes — waxes are a fourth, ester-linked class (not shown to scale)</text><text x="250" y="222" text-anchor="middle" font-size="9.5" fill="#8a1e3c">Membrane formation and energy storage are roles these classes play, not separate lipid types</text></svg>