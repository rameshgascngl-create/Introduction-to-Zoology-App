<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Five kingdoms branching from a common pool, with a note on the modern three-domain system"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Five kingdom comparison</text><circle cx="250" cy="55" r="9" fill="#5a4e42"/><text x="250" y="42" text-anchor="middle" font-size="9.5" fill="#5a4e42">Common ancestral pool (historical grouping)</text><path d="M250,64 C250,110 70,110 70,150" fill="none" stroke="#8f3f0b" stroke-width="1.6"/><rect x="32" y="150" width="76" height="30" rx="6" fill="none" stroke="#8f3f0b" stroke-width="1.8"/><text x="70" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3f0b">Monera</text><path d="M250,64 C250,110 158,110 158,150" fill="none" stroke="#1e5c8a" stroke-width="1.6"/><rect x="120" y="150" width="76" height="30" rx="6" fill="none" stroke="#1e5c8a" stroke-width="1.8"/><text x="158" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e5c8a">Protista</text><path d="M250,64 C250,110 246,110 246,150" fill="none" stroke="#7a3b8c" stroke-width="1.6"/><rect x="208" y="150" width="76" height="30" rx="6" fill="none" stroke="#7a3b8c" stroke-width="1.8"/><text x="246" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a3b8c">Fungi</text><path d="M250,64 C250,110 334,110 334,150" fill="none" stroke="#2e6b4f" stroke-width="1.6"/><rect x="296" y="150" width="76" height="30" rx="6" fill="none" stroke="#2e6b4f" stroke-width="1.8"/><text x="334" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6b4f">Plantae</text><path d="M250,64 C250,110 422,110 422,150" fill="none" stroke="#8a1e3c" stroke-width="1.6"/><rect x="384" y="150" width="76" height="30" rx="6" fill="none" stroke="#8a1e3c" stroke-width="1.8"/><text x="422" y="169" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a1e3c">Animalia</text><text x="250" y="205" text-anchor="middle" font-size="9.5" fill="#5a4e42">Whittaker (1969) — a historical teaching scheme, not the final phylogeny</text><line x1="55" y1="225" x2="445" y2="225" stroke="#b8ab98" stroke-width="1"/><text x="250" y="245" text-anchor="middle" font-size="10" fill="#153f2e" font-weight="bold">Modern view: three domains — Bacteria · Archaea · Eukarya</text><text x="250" y="260" text-anchor="middle" font-size="9" fill="#5a4e42">"Protista" is not one natural evolutionary branch</text></svg>