<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780"><rect width="1280" height="780" fill="#F6FBF9"/><defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#246752" stroke-width="2"/></marker></defs><text x="640" y="55" text-anchor="middle" font-family="DejaVu Sans" font-size="35" font-weight="bold" fill="#174A49">BINOMINAL NOMENCLATURE</text><text x="640" y="91" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#425F6D">ICZN Article 5: names for species consist of genus + specific name</text><text x="640" y="210" text-anchor="middle" font-family="DejaVu Sans" font-size="76" font-weight="bold" fill="#174A49">Panthera leo</text><path d="M485,230 L395,340" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M785,230 L875,340" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="140" y="340" width="450" height="125" rx="19" fill="#E5F1EB" stroke="#286F64" stroke-width="3"/><text x="365.0" y="384" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">GENUS</text><text x="365.0" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">Capital initial: Panthera</text><rect x="685" y="340" width="450" height="125" rx="19" fill="#E5F1EB" stroke="#286F64" stroke-width="3"/><text x="910.0" y="384" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">SPECIFIC EPITHET</text><text x="910.0" y="423" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">Lowercase: leo</text><text x="640" y="545" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="normal" fill="#233B45">Print: italicise both words · Handwriting: underline each word</text><text x="640" y="615" text-anchor="middle" font-f