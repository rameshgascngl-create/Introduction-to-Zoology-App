<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Five stacked atmospheric layers from troposphere at ground level to exosphere"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Temperature-defined atmospheric layers</text><defs><marker id="arr15a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5a4e42"/></marker></defs><rect x="100" y="202" width="290" height="44" fill="#cfe5d8" stroke="#5a4e42" stroke-width="0.8"/><text x="245" y="228.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#153f2e">Troposphere</text><rect x="100" y="166" width="290" height="36" fill="#b9dbe0" stroke="#5a4e42" stroke-width="0.8"/><text x="245" y="188.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#153f2e">Stratosphere</text><rect x="100" y="130" width="290" height="36" fill="#a7cbe8" stroke="#5a4e42" stroke-width="0.8"/><text x="245" y="152.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#153f2e">Mesosphere</text><rect x="100" y="94" width="290" height="36" fill="#9fb7e0" stroke="#5a4e42" stroke-width="0.8"/><text x="245" y="116.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#153f2e">Thermosphere</text><rect x="100" y="58" width="290" height="36" fill="#c9c3ea" stroke="#5a4e42" stroke-width="0.8"/><text x="245" y="80.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#153f2e">Exosphere</text><line x1="100" y1="188" x2="390" y2="188" stroke="#8f3f0b" stroke-width="1.6" stroke-dasharray="4,3"/><text x="398" y="192" font-size="8" fill="#8f3f0b">Ozone concentration</text><text x="398" y="203" font-size="8" fill="#8f3f0b">(within stratosphere)</text><text x="70" y="252" text-anchor="end" font-size="8" fill="#5a4e42">Ground</text><text x="70" y="56" text-anchor="end" font-size="8" fill="#5a4e42">Space</text><line x1="60" y1="246" x2="60" y2="50" stroke="#5a4e42" stroke-width="1" marker-end="url(#arr15a)"/><text x="245" y="257" text-anchor="middle" font-size="8.5" fill="#5a4e42">Five thermal layers by altitude, not to true scale</text><text x="245" y="268" text-anchor="middle" font-size="8" fill="#8a1e3c">Ozone is not a separate layer; the ionosphere overlaps meso- and thermosphere</text></svg>