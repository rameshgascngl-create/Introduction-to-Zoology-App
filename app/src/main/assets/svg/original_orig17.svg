<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Parallel spermatogenesis and oogenesis pathways from germ cell to gametes via meiosis"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Gametogenesis overview</text><defs><marker id="arr17a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1e5c8a"/></marker></defs><text x="140" y="45" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e5c8a">Spermatogenesis</text><rect x="45" y="60" width="75" height="34" rx="6" fill="#e6f2fb" stroke="#1e5c8a" stroke-width="1.4"/><text x="82" y="75" text-anchor="middle" font-size="7.3" fill="#153f2e">Spermatogonium</text><text x="82" y="86" text-anchor="middle" font-size="7.3" fill="#153f2e">(2n)</text><line x1="120" y1="77" x2="135" y2="77" stroke="#1e5c8a" stroke-width="1.6" marker-end="url(#arr17a)"/><rect x="135" y="60" width="75" height="34" rx="6" fill="#e6f2fb" stroke="#1e5c8a" stroke-width="1.4"/><text x="172" y="75" text-anchor="middle" font-size="7.3" fill="#153f2e">Primary</text><text x="172" y="86" text-anchor="middle" font-size="7.3" fill="#153f2e">spermatocyte</text><line x1="210" y1="77" x2="225" y2="77" stroke="#1e5c8a" stroke-width="1.6" marker-end="url(#arr17a)"/><rect x="225" y="60" width="75" height="34" rx="6" fill="#e6f2fb" stroke="#1e5c8a" stroke-width="1.4"/><text x="262" y="75" text-anchor="middle" font-size="7.3" fill="#153f2e">Secondary</text><text x="262" y="86" text-anchor="middle" font-size="7.3" fill="#153f2e">spermatocytes</text><line x1="300" y1="77" x2="315" y2="77" stroke="#1e5c8a" stroke-width="1.6" marker-end="url(#arr17a)"/><rect x="315" y="60" width="75" height="34" rx="6" fill="#e6f2fb" stroke="#1e5c8a" stroke-width="1.4"/><text x="352" y="75" text-anchor="middle" font-size="7.3" fill="#153f2e">Spermatids → Sperm</text><text x="60" y="112" font-size="7.5" fill="#8f3f0b">Meiosis I</text><text x="150" y="112" font-size="7.5" fill="#8f3f0b">Meiosis II</text><line x1="45" y1="125" x2="380" y2="125" stroke="#d8d0c4" stroke-width="1"/><text x="140" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a1e3c">Oogenesis</text><rect x="45" y="165" width="75" height="34" rx="6" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.4"/><text x="82" y="180" text-anchor="middle" font-size="7.3" fill="#5a1224">Oogonium</text><text x="82" y="191" text-anchor="middle" font-size="7.3" fill="#5a1224">(2n)</text><line x1="120" y1="182" x2="135" y2="182" stroke="#8a1e3c" stroke-width="1.6" marker-end="url(#arr17b)"/><rect x="135" y="165" width="75" height="34" rx="6" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.4"/><text x="172" y="180" text-anchor="middle" font-size="7.3" fill="#5a1224">Primary</text><text x="172" y="191" text-anchor="middle" font-size="7.3" fill="#5a1224">oocyte</text><line x1="210" y1="182" x2="225" y2="182" stroke="#8a1e3c" stroke-width="1.6" marker-end="url(#arr17b)"/><rect x="225" y="165" width="75" height="34" rx="6" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.4"/><text x="262" y="180" text-anchor="middle" font-size="7.3" fill="#5a1224">Secondary oocyte</text><text x="262" y="191" text-anchor="middle" font-size="7.3" fill="#5a1224">+ 1st polar body</text><line x1="300" y1="182" x2="315" y2="182" stroke="#8a1e3c" stroke-width="1.6" marker-end="url(#arr17b)"/><rect x="315" y="165" width="75" height="34" rx="6" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.4"/><text x="352" y="180" text-anchor="middle" font-size="7.3" fill="#5a1224">Ovum</text><text x="352" y="191" text-anchor="middle" font-size="7.3" fill="#5a1224">+ polar bodies</text><text x="250" y="222" text-anchor="middle" font-size="9" fill="#5a4e42">Both begin from a diploid germ cell and use meiosis, but timing, arrest and cell output differ</text><text x="250" y="238" text-anchor="middle" font-size="8.5" fill="#8a1e3c">Oogenesis yields one functional ovum per cycle, not an interchangeable "spermatid/ovum" stage</text><defs><marker id="arr17b" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8a1e3c"/></marker></defs></svg>