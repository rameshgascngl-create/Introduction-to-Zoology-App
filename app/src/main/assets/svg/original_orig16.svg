<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Trophic pyramid from producers to apex carnivores with sunlight input and decomposer recycling"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Ecosystem energy and matter pathways</text><defs><marker id="arr16a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5a4e42"/></marker></defs><path d="M40.0,236 L460.0,236 L420.0,199 L80.0,199 Z" fill="#2e6b4f" fill-opacity="0.18" stroke="#2e6b4f" stroke-width="1.8"/><text x="250" y="221.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6b4f">Producers</text><path d="M90.0,199 L410.0,199 L370.0,163 L130.0,163 Z" fill="#4a9b6f" fill-opacity="0.18" stroke="#4a9b6f" stroke-width="1.8"/><text x="250" y="185.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a9b6f">Herbivores</text><path d="M140.0,163 L360.0,163 L320.0,127 L180.0,127 Z" fill="#8f3f0b" fill-opacity="0.18" stroke="#8f3f0b" stroke-width="1.8"/><text x="250" y="149.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3f0b">Carnivores</text><path d="M190.0,127 L310.0,127 L270.0,91 L230.0,91 Z" fill="#8a1e3c" fill-opacity="0.18" stroke="#8a1e3c" stroke-width="1.8"/><text x="250" y="113.0" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a1e3c">Apex carnivores</text><text x="82" y="155" text-anchor="middle" font-size="9.5" fill="#a46a18" font-weight="bold">Sunlight</text><path d="M70,164 L105,220" fill="none" stroke="#c98a3b" stroke-width="2.5" marker-end="url(#arr16a)"/><text x="250" y="67" text-anchor="middle" font-size="8" fill="#5a4e42">Energy flows from producers up trophic levels and dissipates as heat</text><path d="M110,236 C60,236 60,254 110,254 L390,254 C440,254 440,236 390,236" fill="none" stroke="#5a4e42" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arr16a)"/><text x="250" y="268" text-anchor="middle" font-size="8.5" fill="#5a4e42">Decomposers recycle matter from every trophic level, not only the top</text></svg>