<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Molecular biotechnology PCR workflow" style="font-family:Arial,'Noto Sans Tamil',sans-serif;background:#fff;border:1px solid #d5e0e6;border-radius:14px"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><title>Molecular biotechnology PCR workflow</title><desc>DNA collection extraction PCR with controls and result interpretation</desc><defs><marker id="arr-d53fddde" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#275d85"/></marker></defs><rect x="10" y="10" width="700" height="360" rx="13" fill="#fffdfb" stroke="#d5e0e6" stroke-width="1"/><text x="360" y="50" font-size="23" font-weight="600" fill="#1f3446" text-anchor="middle">Molecular biotechnology: evidence pathway</text><text x="360" y="75" font-size="14" font-weight="400" fill="#49647a" text-anchor="middle">மூலக்கூறு உயிர்தொழில்நுட்ப வழிமுறை</text><rect x="27" y="140" width="134" height="118" rx="12" fill="#edf6f9" stroke="#4b85a3" stroke-width="2"/><text x="94.0" y="166" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Sample</text><text x="94.0" y="238" font-size="12" font-weight="400" fill="#465662" text-anchor="middle">மாதிரி</text><path d="M163 201 L199 201" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-d53fddde)"/><rect x="205" y="140" width="134" height="118" rx="12" fill="#edf6f9" stroke="#4b85a3" stroke-width="2"/><text x="272.0" y="166" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Extract DNA</text><text x="272.0" y="238" font-size="12" font-weight="400" fill="#465662" text-anchor="middle" textLength="116" lengthAdjust="spacingAndGlyphs">டி.என்.ஏ பிரித்தல்</text><path d="M341 201 L377 201" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-d53fddde)"/><rect x="383" y="140" width="134" height="118" rx="12" fill="#edf6f9" stroke="#4b85a3" stroke-width="2"/><text x="450.0" y="166" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">PCR + controls</text><text x="450.0" y="238" font-size="12" font-weight="400" fill="#465662" text-anchor="middle" textLength="116" lengthAdjust="spacingAndGlyphs">PCR + கட்டுப்பாடு</text><path d="M519 201 L555 201" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-d53fddde)"/><rect x="561" y="140" width="134" height="118" rx="12" fill="#ebf6ec" stroke="#4b85a3" stroke-width="2"/><text x="628.0" y="166" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Interpret</text><text x="628.0" y="185" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">result</text><text x="628.0" y="238" font-size="12" font-weight="400" fill="#465662" text-anchor="middle" textLength="116" lengthAdjust="spacingAndGlyphs">முடிவு மதிப்பீடு</text><text x="360" y="324" font-size="14" font-weight="400" fill="#1f3446" text-anchor="middle">Controls and contamination checks are essential for interpreting PCR.</text></svg>