<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Mutation, recombination, gene flow and drift feeding into heritable variation, selection and possible adaptation"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Population-level evolutionary mechanisms</text><defs><marker id="arr19a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#153f2e"/></marker></defs><rect x="42" y="55" width="96" height="30" rx="7" fill="#fff" stroke="#1e5c8a" stroke-width="1.8"/><text x="90" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e5c8a">Mutation</text><line x1="90" y1="85" x2="250" y2="120" stroke="#1e5c8a" stroke-width="1.3" marker-end="url(#arr19a)"/><rect x="162" y="55" width="96" height="30" rx="7" fill="#fff" stroke="#2e6b4f" stroke-width="1.8"/><text x="210" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#2e6b4f">Recombination</text><line x1="210" y1="85" x2="250" y2="120" stroke="#2e6b4f" stroke-width="1.3" marker-end="url(#arr19a)"/><rect x="282" y="55" width="96" height="30" rx="7" fill="#fff" stroke="#7a3b8c" stroke-width="1.8"/><text x="330" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#7a3b8c">Gene flow</text><line x1="330" y1="85" x2="250" y2="120" stroke="#7a3b8c" stroke-width="1.3" marker-end="url(#arr19a)"/><rect x="402" y="55" width="96" height="30" rx="7" fill="#fff" stroke="#8f3f0b" stroke-width="1.8"/><text x="450" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#8f3f0b">Genetic drift</text><line x1="450" y1="85" x2="250" y2="120" stroke="#8f3f0b" stroke-width="1.3" marker-end="url(#arr19a)"/><rect x="180" y="122" width="140" height="32" rx="7" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.8"/><text x="250" y="142" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3f0b">Heritable variation</text><line x1="250" y1="154" x2="250" y2="180" stroke="#153f2e" stroke-width="2" marker-end="url(#arr19a)"/><rect x="175" y="182" width="150" height="30" rx="7" fill="#fbe3e3" stroke="#8a1e3c" stroke-width="1.8"/><text x="250" y="201" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8a1e3c">Natural selection / drift</text><line x1="250" y1="212" x2="250" y2="228" stroke="#153f2e" stroke-width="2" marker-end="url(#arr19a)"/><text x="250" y="246" text-anchor="middle" font-size="10" font-weight="bold" fill="#153f2e">Change in allele frequency → possible adaptation</text><text x="250" y="262" text-anchor="middle" font-size="8.5" fill="#8a1e3c">Adaptation is a possible outcome, not an automatic result of every mechanism</text></svg>