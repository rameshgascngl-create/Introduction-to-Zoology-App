<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Vitamins grouped as fat-soluble (A, D, E, K) or water-soluble (B, C)"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Vitamin groups and functions</text><path d="M150,60 C110,60 80,90 80,125 C80,165 115,190 150,190 C185,190 220,165 220,125 C220,90 190,60 150,60 Z" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="2"/><text x="150" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#8f3f0b">Fat-soluble</text><circle cx="115" cy="130" r="15" fill="#fff" stroke="#8f3f0b" stroke-width="1.6"/><text x="115" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3f0b">A</text><circle cx="141" cy="130" r="15" fill="#fff" stroke="#8f3f0b" stroke-width="1.6"/><text x="141" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3f0b">D</text><circle cx="167" cy="130" r="15" fill="#fff" stroke="#8f3f0b" stroke-width="1.6"/><text x="167" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3f0b">E</text><circle cx="193" cy="130" r="15" fill="#fff" stroke="#8f3f0b" stroke-width="1.6"/><text x="193" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3f0b">K</text><text x="150" y="175" text-anchor="middle" font-size="8" fill="#5a4e42">stored in body fat</text><path d="M350,60 C310,60 280,90 280,125 C280,165 315,190 350,190 C385,190 420,165 420,125 C420,90 390,60 350,60 Z" fill="#e6f2fb" stroke="#1e5c8a" stroke-width="2"/><text x="350" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e5c8a">Water-soluble</text><circle cx="325" cy="130" r="17" fill="#fff" stroke="#1e5c8a" stroke-width="1.6"/><text x="325" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e5c8a">B</text><circle cx="375" cy="130" r="17" fill="#fff" stroke="#1e5c8a" stroke-width="1.6"/><text x="375" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e5c8a">C</text><text x="350" y="175" text-anchor="middle" font-size="8" fill="#5a4e42">excreted readily, not stored</text><text x="250" y="215" text-anchor="middle" font-size="9.5" fill="#5a4e42">Grouped by solubility for teaching convenience</text><text x="250" y="232" text-anchor="middle" font-size="9.5" fill="#8a1e3c">Function, storage and toxicity differ within each group — solubility alone does not predict them</text></svg>