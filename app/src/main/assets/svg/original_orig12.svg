<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Carbohydrates classified by number of linked sugar units: monosaccharide, disaccharide, polysaccharide"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Carbohydrate structural classes</text><polygon points="119,109 119,131 100,142 81,131 81,109 100,98" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><text x="100" y="165" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3f0b">Monosaccharide</text><text x="100" y="177" text-anchor="middle" font-size="8" fill="#5a4e42">e.g. glucose</text><polygon points="251,111 251,129 235,138 219,129 219,111 235,102" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><polygon points="289,111 289,129 273,138 257,129 257,111 273,102" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><line x1="251" y1="120" x2="257" y2="120" stroke="#153f2e" stroke-width="2.4"/><text x="254" y="165" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3f0b">Disaccharide</text><text x="254" y="177" text-anchor="middle" font-size="8" fill="#5a4e42">e.g. sucrose</text><polygon points="393,98 393,112 380,120 367,112 367,98 380,90" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><polygon points="421,98 421,112 408,120 395,112 395,98 408,90" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><polygon points="449,98 449,112 436,120 423,112 423,98 436,90" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><polygon points="407,126 407,140 394,148 381,140 381,126 394,118" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><polygon points="435,126 435,140 422,148 409,140 409,126 422,118" fill="#fdf3e6" stroke="#8f3f0b" stroke-width="1.6"/><line x1="395" y1="105" x2="393" y2="105" stroke="#153f2e" stroke-width="2"/><text x="405" y="165" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#8f3f0b">Polysaccharide</text><text x="405" y="177" text-anchor="middle" font-size="8" fill="#5a4e42">starch · glycogen · cellulose</text><line x1="140" y1="120" x2="210" y2="120" stroke="#153f2e" stroke-width="1.6" stroke-dasharray="3,3"/><line x1="298" y1="120" x2="358" y2="120" stroke="#153f2e" stroke-width="1.6" stroke-dasharray="3,3"/><text x="250" y="210" text-anchor="middle" font-size="9.5" fill="#5a4e42">Starch and glycogen store energy; cellulose is structural —</text><text x="250" y="225" text-anchor="middle" font-size="9.5" fill="#8a1e3c">identical glucose units, different linkage and branching change the function</text></svg>