<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780"><rect width="1280" height="780" fill="#F6FBF9"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#246752" stroke="none"/></marker></defs><text x="640" y="55" text-anchor="middle" font-family="DejaVu Sans" font-size="35" font-weight="bold" fill="#174A49">HUMAN OOGENESIS</text><text x="640" y="91" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#425F6D">Arrest points and unequal cytoplasmic division</text><rect x="330" y="120" width="620" height="103" rx="19" fill="#F0E5F8" stroke="#286F64" stroke-width="3"/><text x="640.0" y="164" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">Oogonium</text><text x="640.0" y="203" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">2n — fetal mitotic proliferation</text><path d="M640,224 L640,236" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="330" y="241" width="620" height="103" rx="19" fill="#F8E5EF" stroke="#286F64" stroke-width="3"/><text x="640.0" y="285" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">Primary oocyte</text><text x="640.0" y="324" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">2n — arrest in prophase I</text><path d="M640,345 L640,357" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="330" y="362" width="620" height="103" rx="19" fill="#F0E5F8" stroke="#286F64" stroke-width="3"/><text x="640.0" y="406" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">Secondary oocyte</text><text x="640.0" y="445" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">n — meiosis I completed; 1st polar body</text><path d="M640,466 L640,478" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="330" y="483" width="620" height="103" rx="19" fill="#F8E5EF" stroke="#286F64" stroke-width="3"/><text x="640.0" y="527" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">Ovulated secondary oocyte</text><text x="640.0" y="566" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">Arrest in metaphase II</text><path d="M640,587 L640,599" stroke="#286F64" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="330" y="604" width="620" height="103" rx="19" fill="#F0E5F8" stroke="#286F64" stroke-width="3"/><text x="640.0" y="648" text-anchor="middle" font-family="DejaVu Sans" font-size="24" font-weight="bold" fill="#233B45">Ovum / mature female pronucleus</text><text x="640.0" y="687" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="normal" fill="#233B45">Meiosis II completes after sperm entry</text></svg>