<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" rx="25" fill="#F6FAFB"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#246753" stroke-width="1.5"/></marker></defs><text x="600" y="56" text-anchor="middle" font-family="DejaVu Sans" font-weight="bold" font-size="36" fill="#133E50">LAC CULTIVATION: FIELD OPERATIONS</text><text x="600" y="88" text-anchor="middle" font-family="DejaVu Sans" font-size="18" fill="#586B73">Kerria lacca — resin production on living host twigs</text><rect x="35" y="135" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="205.0" y="178" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">1. Prepare host</text><text x="205.0" y="212" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Prune suitable twigs</text><path d="M381,195 L425,195" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="435" y="135" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="605.0" y="178" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">2. Select broodlac</text><text x="605.0" y="212" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Healthy inoculum</text><path d="M781,195 L825,195" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="835" y="135" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="1005.0" y="178" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">3. Place broodlac</text><text x="1005.0" y="212" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Attach to host shoots</text><rect x="35" y="355" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="205.0" y="398" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">4. Crawler settlement</text><text x="205.0" y="432" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Insects attach to twigs</text><path d="M381,415 L425,415" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="435" y="355" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="605.0" y="398" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">5. Resin secretion</text><text x="605.0" y="432" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Protective lac encrustation</text><path d="M781,415 L825,415" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="835" y="355" width="340" height="120" rx="20" fill="#E3F2EA" stroke="#227A67" stroke-width="2"/><text x="1005.0" y="398" font-family="DejaVu Sans" font-weight="bold" font-size="26" text-anchor="middle" fill="#153E49">6. Harvest / process</text><text x="1005.0" y="432" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#2B5161">Sticklac to seedlac</text><path d="M1050,260 L1050,335" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1050,335 L205,335" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M205,335 L205,350" stroke="#246753" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="600" y="618" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#4B6470">Based on ICAR–Indian Institute of Natural Resins and Gums production guidance.</text></svg>