<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Poultry production: welfare and biosecurity" style="font-family:Arial,'Noto Sans Tamil',sans-serif;background:#fff;border:1px solid #d5e0e6;border-radius:14px"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><title>Poultry production: welfare and biosecurity</title><desc>A well-managed flock depends on nutrition, housing, surveillance and welfare, not yield alone.</desc><defs><marker id="arr-a811cdee" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#275d85"/></marker></defs><rect x="10" y="10" width="700" height="360" rx="13" fill="#fffdfb" stroke="#d5e0e6" stroke-width="1"/><text x="360" y="50" font-size="22" font-weight="600" fill="#1f3446" text-anchor="middle">Poultry production: welfare and biosecurity</text><text x="360" y="75" font-size="14" font-weight="400" fill="#49647a" text-anchor="middle">கோழி வளர்ப்பு: விலங்கு நலம் மற்றும் நோய்த்தடுப்பு</text><rect x="27" y="144" width="134" height="112" rx="12" fill="#e7f5ed" stroke="#4b85a3" stroke-width="2"/><text x="94.0" y="170" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Healthy chicks</text><text x="94.0" y="236" font-size="9" font-weight="400" fill="#465662" text-anchor="middle">ஆரோக்கியக்</text><path d="M163 198 L199 198" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-a811cdee)"/><rect x="205" y="144" width="134" height="112" rx="12" fill="#eef4fb" stroke="#4b85a3" stroke-width="2"/><text x="272.0" y="170" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Feed + water</text><text x="272.0" y="236" font-size="9" font-weight="400" fill="#465662" text-anchor="middle">தீவனம் + நீர்</text><path d="M341 198 L377 198" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-a811cdee)"/><rect x="383" y="144" width="134" height="112" rx="12" fill="#eef4fb" stroke="#4b85a3" stroke-width="2"/><text x="450.0" y="170" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Housing + air</text><text x="450.0" y="236" font-size="9" font-weight="400" fill="#465662" text-anchor="middle">காற்றோட்டம் + இடம்</text><path d="M519 198 L555 198" stroke="#275d85" stroke-width="2.7" fill="none" marker-end="url(#arr-a811cdee)"/><rect x="561" y="144" width="134" height="112" rx="12" fill="#e7f5ed" stroke="#4b85a3" stroke-width="2"/><text x="628.0" y="170" font-size="15" font-weight="600" fill="#1f3446" text-anchor="middle">Health records</text><text x="628.0" y="236" font-size="9" font-weight="400" fill="#465662" text-anchor="middle">நலப் பதிவுகள்</text><text x="360" y="332" font-size="14" font-weight="400" fill="#1f3446" text-anchor="middle">A well-managed flock depends on nutrition, housing, surveillance and welfare, not yield alone.</text></svg>