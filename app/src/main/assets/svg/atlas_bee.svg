<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-label="Honey bee colony roles: queen and workers are female castes, drones are males. These are parallel adult roles, not a development sequence.">
<rect x="1.5" y="1.5" width="517" height="357" rx="16" fill="#fffdf8" stroke="#cadbd1" stroke-width="3"/>
<text x="260" y="36" fill="#174b3e" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">HONEY BEE COLONY</text>
<text x="260" y="58" fill="#4a6270" text-anchor="middle" font-family="sans-serif" font-size="13">Adult castes and sexes · Division of labour</text>
<path d="M24 73 H496" stroke="#d1e0d8" stroke-width="2"/>
<g font-family="sans-serif">
<!-- Queen: reproductive diploid female -->
<rect x="12" y="91" width="158" height="221" rx="13" fill="#fff4df" stroke="#ae792a" stroke-width="2"/>
<rect x="12" y="91" width="158" height="70" rx="13" fill="#f9df9b"/>
<rect x="12" y="145" width="158" height="17" fill="#f9df9b"/>
<text x="91" y="122" fill="#64431c" text-anchor="middle" font-size="21" font-weight="bold">QUEEN</text>
<text x="91" y="145" fill="#64431c" text-anchor="middle" font-size="12" font-family="Noto Sans Tamil, Lohit Tamil, sans-serif">அரசித் தேனீ</text>
<text x="25" y="193" fill="#57472b" font-size="14" font-weight="600">Fertile female</text>
<text x="25" y="220" fill="#57472b" font-size="13">Primary egg-layer</text>
<text x="25" y="246" fill="#57472b" font-size="13">Colony reproduction</text>
<path d="M24 262 H158" stroke="#e4c98b"/>
<text x="25" y="282" fill="#665029" font-size="12">Fertilized egg</text>
<text x="25" y="300" fill="#665029" font-size="12" font-weight="600">Diploid (2n)</text>
<!-- Workers: nonreproductive female caste -->
<rect x="181" y="91" width="158" height="221" rx="13" fill="#eaf7f2" stroke="#387d69" stroke-width="2"/>
<rect x="181" y="91" width="158" height="70" rx="13" fill="#bee6d5"/>
<rect x="181" y="145" width="158" height="17" fill="#bee6d5"/>
<text x="260" y="122" fill="#205c4b" text-anchor="middle" font-size="21" font-weight="bold">WORKERS</text>
<text x="260" y="145" fill="#205c4b" text-anchor="middle" font-size="11.5" font-family="Noto Sans Tamil, Lohit Tamil, sans-serif">வேலைக்காரத் தேனீ</text>
<text x="194" y="193" fill="#275a4f" font-size="14" font-weight="600">Female adults</text>
<text x="194" y="220" fill="#275a4f" font-size="13">Nurse, forage, guard</text>
<text x="194" y="246" fill="#275a4f" font-size="12.5">Usually sterile</text>
<path d="M193 262 H327" stroke="#93cbb5"/>
<text x="194" y="282" fill="#275a4f" font-size="12">Fertilized egg</text>
<text x="194" y="300" fill="#275a4f" font-size="12" font-weight="600">Diploid (2n)</text>
<!-- Drones: haploid males -->
<rect x="350" y="91" width="158" height="221" rx="13" fill="#edf3fc" stroke="#53749c" stroke-width="2"/>
<rect x="350" y="91" width="158" height="70" rx="13" fill="#cbddf6"/>
<rect x="350" y="145" width="158" height="17" fill="#cbddf6"/>
<text x="429" y="122" fill="#274c7a" text-anchor="middle" font-size="21" font-weight="bold">DRONES</text>
<text x="429" y="145" fill="#274c7a" text-anchor="middle" font-size="12" font-family="Noto Sans Tamil, Lohit Tamil, sans-serif">ஆண் தேனீ</text>
<text x="363" y="193" fill="#375371" font-size="14" font-weight="600">Male adults</text>
<text x="363" y="220" fill="#375371" font-size="13">Mate with queens</text>
<text x="363" y="246" fill="#375371" font-size="13">No stinger</text>
<path d="M362 262 H496" stroke="#abc2df"/>
<text x="363" y="282" fill="#375371" font-size="12">Unfertilized egg</text>
<text x="363" y="300" fill="#375371" font-size="12" font-weight="600">Haploid (n)</text>
</g>
<text x="260" y="337" fill="#5d665e" text-anchor="middle" font-family="sans-serif" font-size="12">These are adult roles, not stages in a life cycle.</text>
</svg>