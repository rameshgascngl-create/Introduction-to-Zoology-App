<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" role="img" aria-label="Central dogma flow: DNA to mRNA by transcription, mRNA to protein by translation, with replication and reverse transcription"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><rect x="10" y="10" width="480" height="260" rx="18" fill="#fffdf8" stroke="#d8d0c4" stroke-width="2"/><text x="250" y="34" text-anchor="middle" class="svg-title">Sequence-information transfer</text><defs><marker id="arr10a" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#153f2e"/></marker></defs><rect x="70" y="110" width="100" height="44" rx="9" fill="#fff" stroke="#1e5c8a" stroke-width="2"/><text x="120.0" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e5c8a">DNA</text><rect x="210" y="110" width="100" height="44" rx="9" fill="#fff" stroke="#2e6b4f" stroke-width="2"/><text x="260.0" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6b4f">mRNA</text><rect x="350" y="110" width="100" height="44" rx="9" fill="#fff" stroke="#8a1e3c" stroke-width="2"/><text x="400.0" y="137" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a1e3c">Protein</text><line x1="170" y1="132" x2="205" y2="132" stroke="#153f2e" stroke-width="2" marker-end="url(#arr10a)"/><text x="187" y="124" text-anchor="middle" font-size="8.5" fill="#153f2e">Transcription</text><line x1="310" y1="132" x2="345" y2="132" stroke="#153f2e" stroke-width="2" marker-end="url(#arr10a)"/><text x="327" y="124" text-anchor="middle" font-size="8.5" fill="#153f2e">Translation</text><path d="M70,110 C40,80 40,174 70,154" fill="none" stroke="#1e5c8a" stroke-width="1.6" marker-end="url(#arr10a)"/><text x="18" y="132" font-size="8" fill="#1e5c8a">Replication</text><line x1="205" y1="148" x2="175" y2="148" stroke="#8f3f0b" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr10a)"/><text x="190" y="165" text-anchor="middle" font-size="8" fill="#8f3f0b">Reverse transcription</text><text x="190" y="176" text-anchor="middle" font-size="7.5" fill="#8f3f0b">(retroviruses only)</text><text x="250" y="220" text-anchor="middle" font-size="9.5" fill="#5a4e42">Francis Crick, 1958 — describes the usual direction of sequence-information transfer</text><text x="250" y="235" text-anchor="middle" font-size="9" fill="#8a1e3c">Protein sequence does not normally flow back into nucleic acid</text></svg>