<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-label="Responsible ecotourism safeguards" style="font-family:Arial,'Noto Sans Tamil',sans-serif;background:#fff;border:1px solid #d5e0e6;border-radius:14px"><style>.svg-title{font-family:sans-serif;font-size:15px;font-weight:bold;fill:#1d4435}</style><title>Responsible ecotourism safeguards</title><desc>Four educational safeguards schematic</desc><defs><marker id="arr-6c634ca5" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#275d85"/></marker></defs><rect x="10" y="10" width="700" height="360" rx="13" fill="#fffdfb" stroke="#d5e0e6" stroke-width="1"/><text x="360" y="50" font-size="23" font-weight="600" fill="#1f3446" text-anchor="middle">Responsible ecotourism: four safeguards</text><text x="360" y="76" font-size="14" font-weight="400" fill="#49647a" text-anchor="middle">பொறுப்பான சூழல்சுற்றுலா: நான்கு பாதுகாப்புகள்</text><rect x="35" y="120" width="300" height="84" rx="12" fill="#edf8ee" stroke="#4b85a3" stroke-width="2"/><text x="185.0" y="146" font-size="18" font-weight="600" fill="#1f3446" text-anchor="middle">Wildlife protection</text><text x="185.0" y="184" font-size="12" font-weight="400" fill="#465662" text-anchor="middle">வனவிலங்கு பாதுகாப்பு</text><rect x="385" y="120" width="300" height="84" rx="12" fill="#edf8ee" stroke="#4b85a3" stroke-width="2"/><text x="535.0" y="146" font-size="18" font-weight="600" fill="#1f3446" text-anchor="middle">Local livelihoods</text><text x="535.0" y="184" font-size="12" font-weight="400" fill="#465662" text-anchor="middle">உள்ளூர் வாழ்வாதாரம்</text><rect x="35" y="228" width="300" height="84" rx="12" fill="#edf5fc" stroke="#4b85a3" stroke-width="2"/><text x="185.0" y="254" font-size="18" font-weight="600" fill="#1f3446" text-anchor="middle">Visitor learning</text><text x="185.0" y="292" font-size="12" font-weight="400" fill="#465662" text-anchor="middle">சுற்றுலாப் பயணி கல்வி</text><rect x="385" y="228" width="300" height="84" rx="12" fill="#edf5fc" stroke="#4b85a3" stroke-width="2"/><text x="535.0" y="254" font-size="18" font-weight="600" fill="#1f3446" text-anchor="middle">Impact monitoring</text><text x="535.0" y="292" font-size="12" font-weight="400" fill="#465662" text-anchor="middle">தாக்கக் கண்காணிப்பு</text><text x="360" y="354" font-size="13" font-weight="400" fill="#1f3446" text-anchor="middle">Nature tourism is not ecotourism unless impacts and benefits are managed.</text></svg>